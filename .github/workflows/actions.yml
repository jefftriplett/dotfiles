name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - uses: extractions/setup-just@v3

      - name: Run the lint hooks
        run: uv run --with prek prek run --all-files --show-diff-on-failure
