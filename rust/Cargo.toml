# One Cargo workspace for every Rust tool in the dotfiles repo: a single
# Cargo.lock and target/ dir, shared dependency versions, and one place for
# the release profile. Each member still installs on its own, e.g.
# `cargo install --locked --path rust/projects`.
[workspace]
members = ["homesick-new", "projects"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml_edit = "0.22"

[profile.release]
lto = true
strip = true
