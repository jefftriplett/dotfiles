[project]
site_name = "Dotfiles Manual"
site_url = "https://jefftriplett.github.io/dotfiles/"
site_description = "How Jeff Triplett's macOS dotfiles fit together"
site_author = "Jeff Triplett"

repo_url = "https://github.com/jefftriplett/dotfiles"
repo_name = "jefftriplett/dotfiles"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Just Recipes" = "just.md" },
  { "Hammerspoon" = "hammerspoon.md" },
  { "tmux" = "tmux.md" },
  { "Projects" = [
    { "Project Registry" = "projects.md" },
    { "Machine List" = "machines.md" },
    { "How workon resolves a project" = "workon-process.md" },
  ] },
  { "cmux Workspaces" = "cmux.md" },
  { "Maintenance" = [
    { "Homebrew removals" = "homebrew-removals.md" },
  ] },
  { "Drafts" = [
    { "Project registry post" = "projects-registry-post.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jefftriplett"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
