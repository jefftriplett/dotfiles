# Lint hooks, run by prek: `just lint` locally and the CI workflow on push.
# Optional: `uvx prek install` makes them run on every commit as well.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--exclude=SC1090,SC1091"]
        # Bash config files have no extension, so match them by name too.
        types: [text]
        files: ^(home/\.bash_profile|home/\.bashrc|home/\.bashrc\.d/.*\.bash|.*\.sh)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        # The uv inline scripts in home/bin have no .py extension.
        types: [text]
        files: ^(home/bin/(cmux-.*|tmux-remote-ls|projects-archive|subl-projects|git-jeff|_.*\.py)|scripts/.*\.py)$

  - repo: local
    hooks:
      - id: just-fmt-check
        name: just --fmt --check
        entry: bash -c 'for f in "$@"; do just --unstable --fmt --check --justfile "$f" || exit 1; done' --
        language: system
        files: (^|/)(justfile|.*\.justfile)$

      # Whole-workspace runs, not per file: rustfmt and clippy work on the
      # crates under rust/, which share one Cargo workspace.
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check --manifest-path rust/Cargo.toml
        language: system
        files: ^rust/
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --quiet --locked --workspace --all-targets --manifest-path rust/Cargo.toml -- -D warnings
        language: system
        files: ^rust/
        pass_filenames: false
